version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    volumes:
    - zookeeper_data:/var/lib/zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  eureka-server:
    build:
      context: ./Eurekaserver
    ports:
      - "8761:8761"

  user-service:
    build:
      context: ./user-service
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATA_MONGODB_URI: mongodb+srv://jaymehta2189:jaymehta24@cluster0.ozmvbup.mongodb.net/User_service2
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

  transactions-service:
    build:
      context: ./transactionservice
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: transactionservice
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb+srv://jaymehta2189:jaymehta24@cluster0.ozmvbup.mongodb.net/transaction_service2
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

  budget-service:
    build:
      context: ./budgetservice
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: budgetservice
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb+srv://jaymehta2189:jaymehta24@cluster0.ozmvbup.mongodb.net/budgetservice2
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

  wealthwise:
    build:
      context: ./wealthwise
    depends_on:
      - kafka
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: wealthwise
      SPRING_DATA_MONGODB_URI: mongodb+srv://jaymehta2189:jaymehta24@cluster0.ozmvbup.mongodb.net/spend_analysis2
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

  apigateway:
    build:
      context: ./ApiGateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka

volumes:
  zookeeper_data:
  kafka_data: